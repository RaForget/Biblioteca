# Complemento explícito: a execução normal continua usando a imagem compilada.
services:
  web:
    image: biblioteca-web:dev
    build:
      context: ./web
      target: development
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./web/index.html
          target: /app/index.html
          initial_sync: true
        - action: rebuild
          path: ./web/tsconfig.json
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/package-lock.json
        - action: rebuild
          path: ./web/Dockerfile
  api:
    image: biblioteca-api:dev
    build:
      context: ./api
      target: development
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./api/tests
          target: /app/tests
          initial_sync: true
        - action: sync+restart
          path: ./api/tsconfig.json
          target: /app/tsconfig.json
          initial_sync: true
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./api/package-lock.json
        - action: rebuild
          path: ./api/Dockerfile
